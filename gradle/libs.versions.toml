[versions]

# Plugins
android-gradle-plugin = "9.1.0"
gradle = "9.1.0"
multidex = "2.0.1"
spotless-plugin-gradle = "8.4.0"

# Kotlin
kotlin = "2.3.20"
ksp = "2.3.6"
ktlint = "0.41.0"
room = "2.8.4"

# AndroidX
androidx-core-ktx = "1.13.1"
androidx-appcompat = "1.7.1"

# UI
material = "1.10.0"

# Hilt DI
hilt = "2.59.2"

# JVM Unit Tests
junit = "4.13.2"

# Instrumentation Tests
androidx-junit = "1.3.0"
androidx-espresso-core = "3.7.0"
legacy-support-v4 = "1.0.0"

[libraries]

# Plugins
android-plugin-gradle = { module = "com.android.tools.build:gradle", version.ref = "android-gradle-plugin" }
gradle-9_1_0 = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
kotlin-plugin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-plugin-gradle = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }
spotless-plugin-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless-plugin-gradle" }
hilt-plugin-gradle = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }

# UI
material = { module = "com.google.android.material:material", version = "1.13.0" }

# Hilt DI
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

# Hilt DI - JVM / Instrumentation Tests
hilt-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# JVM Unit Tests
junit = { module = "junit:junit", version.ref = "junit" }

# Instrumentation Tests
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso-core" }
support-v4 = { module = "androidx.legacy:legacy-support-v4", version.ref = "legacy-support-v4" }

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
