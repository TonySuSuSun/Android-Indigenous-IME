[versions]

# Plugins
android-gradle-plugin = "9.1.0"
spotless-plugin-gradle = "8.3.0"

# Kotlin
kotlin = "2.3.20"
ktlint = "0.41.0"

# AndroidX
androidx-core-ktx = "1.18.0"
androidx-appcompat = "1.7.1"
legacy-support-v4 = "1.0.0"

# Hilt DI
hilt = "2.59.2"

# JVM Unit Tests
junit = "4.13.2"

# Instrumentation Tests
androidx-junit = "1.3.0"
androidx-espresso-core = "3.7.0"

[libraries]

# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }

# UI
material = { module = "com.google.android.material:material", version = "1.13.0" }

# Hilt DI
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

# Hilt DI - JVM / Instrumentation Tests
hilt-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# JVM Unit Tests
junit = { module = "junit:junit", version.ref = "junit" }

# Instrumentation Tests
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso-core" }
support-v4 = { module = "androidx.legacy:legacy-support-v4", version.ref = "legacy-support-v4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless-plugin-gradle" }
legacy-kapt = { id = "com.android.legacy-kapt", version.ref = "android-gradle-plugin" }
